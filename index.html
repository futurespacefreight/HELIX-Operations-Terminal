<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELIX Operations Terminal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="topbar">

    <div class="terminal-name">
        HELIX Operations Terminal
    </div>

    <div class="system-info">

        <span id="systemStatus">🟢 ONLINE</span>

        <span id="currentDate"></span>

        <span id="currentTime"></span>

    </div>

</header>
<div class="sidebar">

    <div class="logo">
        <h1>HELIX</h1>
        <span>Operations Terminal</span>
    </div>

    <nav>

    <button onclick="showPage('dashboard')">Dashboard</button>

    <button onclick="showPage('missions')">Missionen</button>

    <button onclick="showPage('inventory')">Inventar</button>

    <button onclick="showPage('finance')">Konten</button>

    <button onclick="showPage('logbook')">Logbuch</button>

    <button onclick="showPage('crew')">Crew</button>

    <button onclick="showPage('settings')">Einstellungen</button>

</nav>

</div>

<div class="content">

    <h2>Dashboard</h2>

    <div class="card">

        <h3>Status</h3>

        <p>🟢 System Online</p>

        <p>Keine aktive Mission</p>

        <p>Credits: 18.450 Cr</p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
